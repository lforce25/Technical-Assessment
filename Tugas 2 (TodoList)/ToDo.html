<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDo App</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; font: 16px/1.5 system-ui, sans-serif; background: #f1f5f9; color: #172033; }
    main { max-width: 620px; margin: auto; padding: 28px; background: #fff; border-radius: 14px; box-shadow: 0 8px 28px #17255418; }
    h1 { margin: 0 0 20px; }
    form { display: flex; gap: 10px; }
    input[type="text"] { flex: 1; min-width: 0; padding: 11px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
    button { padding: 9px 13px; border: 0; border-radius: 8px; background: #2563eb; color: white; font: inherit; cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    #tasks { list-style: none; padding: 0; margin: 20px 0 0; }
    .task { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-bottom: 1px solid #e2e8f0; }
    .task .label { flex: 1; overflow-wrap: anywhere; }
    .task.done .label { color: #64748b; text-decoration: line-through; }
    .edit { background: #475569; }
    .delete { background: #dc2626; }
    #empty { color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>My ToDo List</h1>
    <form id="task-form">
      <input id="task-input" type="text" placeholder="To Do List..." aria-label="New task" maxlength="200" required>
      <button type="submit">Add task</button>
    </form>
    <ul id="tasks" aria-label="Tasks"></ul>
    <p id="empty">No tasks yet. Add one above!</p>
  </main>
  <script>
    const form = document.querySelector('#task-form');
    const input = document.querySelector('#task-input');
    const taskList = document.querySelector('#tasks');
    const emptyMessage = document.querySelector('#empty');
    const STORAGE_KEY = 'todo-app-tasks';

    let tasks = [];
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
      if (Array.isArray(saved)) tasks = saved.filter(task => task && typeof task.id === 'string' && typeof task.text === 'string');
    } catch { }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); }
      catch { }
    }

    function render() {
      taskList.replaceChildren();
      emptyMessage.hidden = tasks.length !== 0;
      tasks.forEach(task => {
        const row = document.createElement('li');
        row.className = `task${task.completed ? ' done' : ''}`;

        const check = document.createElement('input');
        check.type = 'checkbox';
        check.checked = Boolean(task.completed);
        check.setAttribute('aria-label', `Mark ${task.text} ${task.completed ? 'incomplete' : 'complete'}`);
        check.addEventListener('change', () => {
          task.completed = check.checked;
          save();
          render();
        });

        const label = document.createElement('span');
        label.className = 'label';
        label.textContent = task.text;

        const edit = document.createElement('button');
        edit.type = 'button';
        edit.className = 'edit';
        edit.textContent = 'Edit';
        edit.setAttribute('aria-label', `Edit ${task.text}`);
        edit.addEventListener('click', () => {
          const value = window.prompt('Edit task:', task.text);
          if (value === null || !value.trim()) return;
          task.text = value.trim().slice(0, 200);
          save();
          render();
        });

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'delete';
        remove.textContent = 'Delete';
        remove.setAttribute('aria-label', `Delete ${task.text}`);
        remove.addEventListener('click', () => {
          tasks = tasks.filter(item => item.id !== task.id);
          save();
          render();
        });

        row.append(check, label, edit, remove);
        taskList.append(row);
      });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      const id = typeof crypto !== 'undefined' && crypto.randomUUID
        ? crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;
      tasks.push({ id, text: text.slice(0, 200), completed: false });
      save();
      render();
      form.reset();
      input.focus();
    });

    render();
  </script>
</body>
</html>
